[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "esthien_argus_sdk"
version = "0.7.4"
description = "Argus SDK: safety-supervised inference for physical systems - profile compilation, regression evaluation, and evidence packages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyNaCl>=1.6.2,<1.7.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "cocotb>=1.9",
]

[project.scripts]
argus = "argus.release_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
# Public SDK surface only. Internal strategy, simulation, benchmarking, and
# research modules are not part of the distributed package.
include = [
    "argus",
    "argus.safety",
    "argus.compiler",
    "argus.protocol",
    "argus.abi",
    "argus.regression",
    "argus.adapters",
    "argus.resources",
]
exclude = ["atlas*", "esthien*"]

[tool.setuptools.package-data]
"argus.resources" = ["profiles/*.json"]
# The native C ABI library is platform-specific and is distributed with the
# per-platform release packages and language wrappers, not in the universal
# Python wheel.
"argus.safety" = ["*.pyd", "*.so", "*.dylib"]
"argus.compiler" = ["*.pyd", "*.so", "*.dylib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "devonly: internal development tooling tests, not part of the public release surface",
]
